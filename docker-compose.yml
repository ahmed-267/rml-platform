services:
  postgres:
    image: postgres:16
    container_name: rml_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rml_platform
      POSTGRES_USER: rml_user
      POSTGRES_PASSWORD: rml_password
    ports:
      - "5432:5432"
    volumes:
      - rml_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rml_user -d rml_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    container_name: rml_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  rml_postgres_data:
